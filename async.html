<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Async Weather App</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 8px;
  text-align: center;
  width: 300px;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

#status {
  margin-top: 20px;
  font-weight: bold;
}

  </style>
</head>
<body>

  <div class="container">
    <h1>Weather App</h1>
    <button id="btn">Get Weather</button>
    <p id="status"></p>
  </div>
  <script>
const btn = document.getElementById("btn");
const statusText = document.getElementById("status");

function fetchWeather() {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      resolve("🌤️  Temperature: 28°C");
    }, 2000);
  });
}

async function getWeather() {
  statusText.textContent = "Loading weather... ⏳";

  try {
    const data = await fetchWeather();
    statusText.textContent = data;
  } catch (error) {
    statusText.textContent = "Error fetching data ❌";
  }
}

btn.addEventListener("click", getWeather);

  </script>
</body>
</html>
