<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
</head>
<body>
    <h1>To do list</h1>

    <form onsubmit="addtaskpage(event)">
        <input type="text" name="" id="texttask" placeholder="Enter the task">
        <input type="submit" value="Add task">
        <ul id="list-container"></ul>
    </form>

    <script>

        let addtaskpage =(event)=>{
            event.preventDefault()
            let input = document.getElementById("texttask")
            let textpara = input.value

            let list_container =  document.getElementById("list-container")

            let li = document.createElement("li")
            li.textContent=textpara
            let but = document.createElement("button")
            but.textContent="Delete"
            but.style.backgroundColor="black"
            but.style.color="white"
            but.onclick=()=>{
                li.remove()
            }
            li.appendChild(but)
            list_container.appendChild(li)
        }

    </script>
</body>
</html>
